# Weekly: Zotero "My Publications" (+ Google Scholar counts) -> quarto/data/papers.yml and preview images,
# then republish (publish.yml also rebuilds the CV from the same papers.yml).
name: Zotero

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: write
  actions: write # to start publish.yml after a sync commit

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyzotero==1.5.19 bibtexparser==1.4.3 scholarly==1.7.11 pyyaml
      - name: Sync
        working-directory: quarto
        run: python scripts/zotero_sync.py
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        id: commit
        with:
          commit_message: Zotero sync
      # pushes made with GITHUB_TOKEN don't trigger other workflows, so start the publish explicitly
      - name: Publish if papers changed
        if: steps.commit.outputs.changes_detected == 'true'
        run: gh workflow run publish.yml --ref ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
